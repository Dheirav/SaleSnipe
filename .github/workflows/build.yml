name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src/frontend

      - name: Build
        run: npm run build
        env:
          CI: false
